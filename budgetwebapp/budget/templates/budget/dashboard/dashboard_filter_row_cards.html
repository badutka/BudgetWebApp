{% load static %}
<div class="filter-row-wrapper filter-row-collapsible">
  <i class="bi bi-filter" style="color: white;"></i>

  <button class="refresh-button"
          style="background: none; border: none; color: white; cursor: pointer; font-size: clamp(1.5rem, 1vw, 2rem); line-height: 1;"
          onclick="refreshCard(this)">
    &#x21bb;
  </button>
  <div style="background: white; height: 33px; width: 1px; box-shadow: 0 0 30px white;"></div>
  <!--    <span class="filter-title">Filters</span>-->
  <div class="filter-row">
    <input type="hidden" name="dsb_row_filter" value="cards_row" form="dashboard-filter-cards-row-form">

    <!-- Aggregation Dropdown -->
    <div class="dropdown">
      <button class="btn btn-light dropdown-toggle" type="button"
              id="cards_row_aggregationDropdownButton"
              data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
        Aggregation <span class="agg-button-text"></span>
      </button>
      <div class="dropdown-menu p-3" style="min-width: 200px;" aria-labelledby="cards_row_aggregationDropdownButton">
        <fieldset class="mb-0">
          {% for period in periods %}
          <div class="form-check">
            <input class="form-check-input"
                   type="radio"
                   name="cards_row_aggregation"
                   value="{{ period }}"
                   id="cards_row_aggregation-{{ period }}"
                   form="dashboard-filter-cards-row-form"
                   {% if request.GET.cards_row_aggregation == period %}
                      checked
                   {% endif %}>
            <label class="form-check-label" for="cards_row_aggregation-{{ period }}">
              {{ period|title }}
            </label>
          </div>
          {% endfor %}
        </fieldset>
      </div>
    </div>

    <!-- Date Inputs -->
    <div class="for-label-wrapper">
      <label>For:</label>
    </div>
    <div id="cards_row_date_wrapper">
    <!--
      Dynamic input type based on aggregation:
      - If aggregation is 'day', we need full date (YYYY-MM-DD) to avoid truncation.
      - Otherwise, default to month (YYYY-MM), which works for month and year selections.

      Value formatting:
      - type="date" → 'YYYY-MM-DD'
      - type="month" → 'YYYY-MM'

      This prevents the "downscaling" issue:
      If the input is type="month" but the value includes a day, the browser will default
      the day to 1 when rendering, causing the observed behavior on page refresh.
    -->
      <input
        type="{% if aggregation == 'day' %}date{% else %}month{% endif %}"
        id="cards_row_date_for"
        name="cards_row_date_for"
        form="dashboard-filter-cards-row-form"
        value="{% if aggregation == 'day' %}{{ date_for|default_if_none:''|date:'Y-m-d' }}{% else %}{{ date_for|default_if_none:''|date:'Y-m' }}{% endif %}">
      </div>

    <label>From:</label>
    <input type="date" name="cards_row_date_from" id="cards_row_date_from" form="dashboard-filter-cards-row-form">

    <label>To:</label>
    <input type="date" name="cards_row_date_to" id="cards_row_date_to" form="dashboard-filter-cards-row-form">

    <!-- Transaction Types Dropdown -->
    <div class="dropdown">
      <button class="btn btn-light dropdown-toggle" type="button"
              id="cards_row_transaction_typeDropdownButton"
              data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
        Transaction Types
      </button>
      <div class="dropdown-menu p-3" style="min-width: 200px;" aria-labelledby="transactionTypeDropdownButton">
        <fieldset class="mb-0">
          <div class="form-check">
            <input class="form-check-input" type="checkbox"
                   id="cards_row_transaction_type-select-all"
                   form="dashboard-filter-cards-row-form"
                   {% is_checked request "cards_row_transaction_type" default=True %}>
            <label class="form-check-label fw-bold" for="cards_row_transaction_type-select-all">
              Select All
            </label>
          </div>
          <hr>
          {% for name in transaction_types %}
          <div class="form-check">
            <input class="form-check-input"
                   type="checkbox"
                   name="cards_row_transaction_type"
                   value="{{ name }}"
                   id="transaction-type-{{ name }}"
                   form="dashboard-filter-cards-row-form"
                   {% is_checked request "cards_row_transaction_type" name %}>
            <label class="form-check-label" for="transaction-type-{{ name }}">
              {{ name }}
            </label>
          </div>
          {% endfor %}
        </fieldset>
      </div>
    </div>

    <!-- Parent Categories Dropdown -->
    <div class="dropdown">
      <button class="btn btn-light dropdown-toggle" type="button"
              id="cards_row_parent_categoryDropdownButton"
              data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
        Parent Categories <!-- <span class="badge bg-primary" id="cards_row_parent_category-count" style="display:none;"></span> -->
      </button>
      <div class="dropdown-menu p-3" style="min-width: 200px;" aria-labelledby="parentCategoryDropdownButton">
        <fieldset class="mb-0">
          <div class="form-check">
            <input class="form-check-input" type="checkbox"
                   id="cards_row_parent_category-select-all"
                   form="dashboard-filter-cards-row-form"
                   {% is_checked request "cards_row_parent_category" default=True %}>
            <label class="form-check-label fw-bold" for="cards_row_parent_category-select-all">
              Select All
            </label>
          </div>
          <hr>
          {% for parent_category in parent_categories %}
          <div class="form-check">
            <input class="form-check-input"
                   type="checkbox"
                   name="cards_row_parent_category"
                   value="{{ parent_category.id }}"
                   id="parent-category-{{ parent_category.id }}"
                   form="dashboard-filter-cards-row-form"
                   {% is_checked request "cards_row_parent_category" parent_category.id|stringformat:"s" %}>
            <label class="form-check-label" for="parent-category-{{ parent_category.id }}">
              {{ parent_category.name }}
            </label>
          </div>
          {% endfor %}
        </fieldset>
      </div>
    </div>

    <!-- Parent Categories Dropdown -->
    <div class="dropdown">
      <button class="btn btn-light dropdown-toggle" type="button"
              id="cards_row_categoryDropdownButton"
              data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
        Categories
      </button>
      <div class="dropdown-menu p-3" style="min-width: 200px;" aria-labelledby="categoryDropdownButton">
        <fieldset class="mb-0">
          <div class="form-check">
            <input class="form-check-input" type="checkbox"
                   id="cards_row_category-select-all"
                   form="dashboard-filter-cards-row-form"
                   {% is_checked request "cards_row_category" default=True %}>
            <label class="form-check-label fw-bold" for="cards_row_category-select-all">
              Select All
            </label>
          </div>
          <hr>
          {% for category in categories %}
          <div class="form-check">
            <input class="form-check-input"
                   type="checkbox"
                   name="cards_row_category"
                   value="{{ category.id }}"
                   id="category-{{ category.id }}"
                   form="dashboard-filter-cards-row-form"
                   {% is_checked request "cards_row_category" category.id|stringformat:"s" %}>
            <label class="form-check-label" for="category-{{ category.id }}">
              {{ category.name }}
            </label>
          </div>
          {% endfor %}
        </fieldset>
      </div>
    </div>

    <!-- Form right before Apply button -->
    <form id="dashboard-filter-cards-row-form"
          hx-get="{% url 'budget:chart_summary' %}"
          hx-target="#dashboard-cards-container"
          hx-push-url="true"
          hx-trigger="submit"
          style="display: contents;">
    </form>

    <!-- Hidden field to indicate that the filter form has been submitted.
    Used to distinguish first page load (no submitted param) from user submissions,
    so that checkboxes and inputs can retain their selected values correctly,
    even if all checkboxes are unchecked or inputs are empty. -->
    <input type="hidden" name="submitted" value="1" form="dashboard-filter-cards-row-form">

    <!-- Apply kept in place, now explicitly submits the form via form="..." -->
    <button form="dashboard-filter-cards-row-form" type="submit">Apply</button>


  </div>
</div>
