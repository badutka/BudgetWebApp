{% load static %}

<!-- Aggregation Dropdown -->
<div class="dropdown">
  <button class="btn btn-light dropdown-toggle" type="button"
          id="{{ row_name }}_aggregationDropdownButton"
          data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
    Aggregation <span class="agg-button-text"></span>
  </button>
  <div class="dropdown-menu p-3" style="min-width: 200px;" aria-labelledby="{{ row_name }}_aggregationDropdownButton">
    <fieldset class="mb-0">
      {% for period in periods|exclude:"all_time" %}
      <div class="form-check">
        <input class="form-check-input"
               type="radio"
               name="{{ row_name }}_aggregation"
               value="{{ period }}"
               id="{{ row_name }}_aggregation-{{ period }}"
               form="{{ form_name }}"
               {% with key=row_name|add:"_aggregation" %}
                 {% if request.GET|get_item:key == period %}
                    checked
                 {% endif %}>
               {% endwith %}
        <label class="form-check-label" for="{{ row_name }}_aggregation-{{ period }}">
          {{ period|title }}
        </label>
      </div>
      {% endfor %}
    </fieldset>
  </div>
</div>
