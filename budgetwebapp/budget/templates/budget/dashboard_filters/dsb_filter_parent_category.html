{% load static %}

<!-- Parent Categories Dropdown -->
<div class="dropdown">
  <button class="btn btn-light dropdown-toggle" type="button"
          id="{{ row_name }}_parent_categoryDropdownButton"
          data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
    Parent Categories
  </button>
  <div class="dropdown-menu p-3" style="min-width: 200px;" aria-labelledby="{{ row_name }}_parent_categoryDropdownButton">
    <fieldset class="mb-0">
      <div class="form-check">
        <input class="form-check-input" type="checkbox"
               id="{{ row_name }}_parent_category-select-all"
               form="{{ form_name }}"
               {% is_checked request row_name|add:"_parent_category" default=True %}>
        <label class="form-check-label fw-bold" for="{{ row_name }}_parent_category-select-all">
          Select All
        </label>
      </div>
      <hr>
      {% for parent_category in parent_categories %}
      <div class="form-check">
        <input class="form-check-input"
               type="checkbox"
               name="{{ row_name }}_parent_category"
               value="{{ parent_category.id }}"
               id="{{ row_name }}-parent-category-{{ parent_category.id }}"
               form="{{ form_name }}"
               {% is_checked request row_name|add:"_parent_category" parent_category.id|stringformat:"s" %}>
        <label class="form-check-label" for="{{ row_name }}-parent-category-{{ parent_category.id }}">
          {{ parent_category.name }}
        </label>
      </div>
      {% endfor %}
    </fieldset>
  </div>
</div>
