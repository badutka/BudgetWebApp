{% extends "base.html" %}
{% load static %}
{% load template_filters %}


{% block content %}

<div class="dashboard-grid" style="--grid-cols: {{ dashboard.grid_columns|default:32 }}; max-width: 1400px;">
    {% for widget in widgets %}
        {% include 'investments/overview_widget_partial.html' with widget=widget %}
    {% empty %}
        <p>No widgets available.</p>
    {% endfor %}
</div>


{% endblock content %}
